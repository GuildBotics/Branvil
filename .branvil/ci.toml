# Temporary #78 per-wait measurement alongside a real Rust job.

[[jobs]]
name = "web"
image = "guildbotics/agent-environment:dev"
commands = [
  "cd web && npm_config_cache=/work/.ci/npm npm ci",
  "cd web && npm run lint",
  "cd web && npm run typecheck",
  "cd web && npm run test",
]
timeout_secs = 1200
cache = { paths = [".ci/npm"], key_files = ["web/package-lock.json"] }
artifacts = [{ name = "web-tests", paths = ["web/test-results/timing.json"] }]


[[jobs]]
name = "test"
image = "guildbotics/agent-environment:dev"
commands = [
  "find . -path ./target -prune -o -path ./.ci -prune -o -exec touch -c {} +",
  "CARGO_HOME=/work/.ci/cargo-home CARGO_INCREMENTAL=0 cargo test",
]
timeout_secs = 1800
cache = { paths = [".ci/cargo-home/registry", "target"], key_files = ["Cargo.lock"] }
