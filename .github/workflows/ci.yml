name: CI

# Branvil's own CI (.branvil/ci.toml) runs every check on Linux. This workflow
# runs only what it cannot: the scripts' tests on macOS, the system the service
# and its scripts run on (BSD tools, macOS process handling).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Development launcher tests
        run: python3 -m unittest discover -s tests -p test_dev_script.py -v
